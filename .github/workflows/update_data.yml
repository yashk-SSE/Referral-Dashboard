# =============================================================================
# GitHub Actions Workflow — SolarSquare Dashboard Data Update
# Runs daily at 10:30 AM IST (5:00 AM UTC)
# Can also be triggered manually from GitHub Actions tab
# =============================================================================

name: Update Dashboard Data

on:
  schedule:
    - cron: '0 5 * * *'    # 10:30 AM IST = 5:00 AM UTC daily
  workflow_dispatch:         # Manual trigger button in GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # Safety: kill job if it runs > 30 mins

    steps:

      # ── Step 1: Download your repo files onto GitHub's server
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Install BigQuery library
      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery pandas pyarrow db-dtypes

      # ── Step 4: Log in to Google Cloud using your secret key
      # (GCP_SERVICE_ACCOUNT_KEY is stored in GitHub Secrets — never visible)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # ── Step 5: Run your Python script (queries BigQuery, saves JSON files)
      - name: Fetch data from BigQuery
        run: python scripts/fetch_data.py

      # ── Step 6: Commit the new JSON files back to the repo
      # If data didn't change, nothing is committed (no empty commits)
      - name: Commit and push updated data files
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "Dashboard Bot"
          git add data/referral_effort.json data/referral_leads.json
          git diff --staged --quiet || git commit -m "📊 Data refresh: $(TZ='Asia/Kolkata' date '+%d %b %Y %I:%M %p IST')"
          git push
